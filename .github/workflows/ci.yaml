name: ci.yaml

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Build with Gradle
        run: ./gradlew test --no-daemon

  intTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Build with Gradle
        run: ./gradlew intTest --no-daemon