# OTel Java agent config (RFC-0002): annotations only, the agent owns the single SDK.
otel.service.name=stopgap

otel.instrumentation.common.default-enabled=false
otel.instrumentation.opentelemetry-api.enabled=true
otel.instrumentation.opentelemetry-instrumentation-annotations.enabled=true
otel.instrumentation.executors.enabled=true

otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.traces.endpoint=http://localhost:10428/insert/opentelemetry/v1/traces
otel.metrics.exporter=none
otel.logs.exporter=none
