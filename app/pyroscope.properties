# Pyroscope profiler config (RFC-0002), read by the OTel agent's Pyroscope extension; it never reads otel.properties.
# Must match otel.service.name: Grafana finds a span's profile by service name. The default is a random javaspy.* name.
pyroscope.application.name=stopgap
pyroscope.server.address=http://localhost:4040
# itimer: perf_events-based cpu is usually blocked in containers.
pyroscope.profiler.event=itimer
pyroscope.format=jfr
